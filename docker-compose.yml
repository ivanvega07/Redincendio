version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: abvpa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abvpa_user
      POSTGRES_PASSWORD: abvpa_pass
      POSTGRES_DB: abvpa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abvpa_user -d abvpa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
